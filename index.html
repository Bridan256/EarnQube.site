<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>EarnQube.site - Earn Money Online | Chat, Watch Videos & More</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" referrerpolicy="no-referrer" />
    <style>
          :root {
                  --bg: #081723;
                  --surface: rgba(18, 41, 70, 0.85);
                  --surface-soft: rgba(28, 63, 108, 0.45);
                  --text: #eef3f8;
                  --muted: #9fb8d4;
                  --accent: #f2ca6c;
                  --accent-strong: #28c9ff;
                  --button: linear-gradient(135deg, #22d3ee, #0f7cff);
                  --shadow: 0 32px 90px rgba(8, 20, 44, 0.35);
          }

          * { box-sizing: border-box; }
          html, body { margin: 0; min-height: 100%; }
          body {
                  font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                  color: var(--text);
                  background: radial-gradient(circle at top left, rgba(40, 201, 255, 0.16), transparent 20%),
                                      radial-gradient(circle at bottom right, rgba(242, 202, 108, 0.12), transparent 18%),
                                      linear-gradient(180deg, #071523 0%, #04111f 100%);
          }

          .page {
                  max-width: 1180px;
                  margin: 0 auto;
                  padding: 32px 24px 48px;
          }

          .site-header {
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  gap: 18px;
                  padding: 10px 0 22px;
                  flex-wrap: wrap;
                  position: relative;
          }

          .logo {
                  font-size: 1.05rem;
                  font-weight: 800;
                  letter-spacing: 0.35em;
                  color: white;
                  text-decoration: none;
                  text-transform: uppercase;
          }

          .nav-links {
                  display: flex;
                  gap: 20px;
                  flex-wrap: wrap;
                  align-items: center;
                  transition: max-height 240ms ease, opacity 240ms ease;
          }

          .nav-links a {
                  color: #cbd7ea;
                  text-decoration: none;
                  font-weight: 600;
                  transition: color 180ms ease;
          }

          .nav-links a:hover {
                  color: white;
          }

          .nav-actions {
                  display: flex;
                  gap: 14px;
                  flex-wrap: wrap;
                  align-items: center;
          }

          .menu-toggle {
                  display: none;
                  border: none;
                  background: rgba(255,255,255,0.08);
                  color: #eef3f8;
                  width: 48px;
                  height: 48px;
                  border-radius: 18px;
                  cursor: pointer;
                  align-items: center;
                  justify-content: center;
                  font-size: 1.1rem;
                  transition: transform 180ms ease, background 180ms ease;
          }

          .menu-toggle:hover {
                  transform: translateY(-1px);
                  background: rgba(255,255,255,0.12);
          }

          .btn {
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                  border: none;
                  border-radius: 999px;
                  cursor: pointer;
                  transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
                  text-decoration: none;
                  color: inherit;
                  font-weight: 700;
                  white-space: nowrap;
          }

          .btn-primary {
                  background: var(--button);
                  color: #fff;
                  padding: 14px 28px;
                  box-shadow: 0 20px 55px rgba(12, 84, 180, 0.22);
          }

          .btn-secondary {
                  background: rgba(255, 255, 255, 0.08);
                  color: var(--text);
                  padding: 14px 24px;
                  border: 1px solid rgba(255,255,255,0.12);
          }

          .btn:hover {
                  transform: translateY(-2px);
          }

          .hero {
                  display: grid;
                  grid-template-columns: 1.2fr 0.8fr;
                  gap: 32px;
                  align-items: center;
                  padding: 42px 0 20px;
          }

          .hero-copy small {
                  display: inline-flex;
                  padding: 10px 16px;
                  border-radius: 999px;
                  background: rgba(40, 201, 255, 0.12);
                  color: var(--accent-strong);
                  font-weight: 700;
                  letter-spacing: 0.05em;
                  margin-bottom: 22px;
                 
    </style></title>
  </head>
